<!DOCTYPE html>
<html lang="ko" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyAI — AI 공부 매니저</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['"Noto Sans KR"', 'sans-serif'] }
      }
    }
  };
</script>
<style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface2: #f1f5f9;
  --border: #e2e8f0;
  --text: #0f172a;
  --text2: #64748b;
  --primary: #6366f1;
  --primary-light: #eef2ff;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.05);
}
.dark {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --primary-light: #1e1b4b;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background .3s, color .3s;
  overflow-x: hidden;
}

/* ── Layout ── */
#app { display: flex; height: 100vh; overflow: hidden; }

#sidebar {
  width: 240px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  transition: transform .3s, width .3s;
}

#main-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#topbar {
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 12px;
  flex-shrink: 0;
}

#content {
  flex: 1;
  overflow-y: auto;
  padding: 28px;
}

/* ── Sidebar ── */
.sidebar-logo {
  padding: 20px 16px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}
.logo-mark {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.logo-text { font-weight: 700; font-size: 16px; }

.sidebar-section { padding: 12px 8px 4px; }
.sidebar-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 0 8px;
  margin-bottom: 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text2);
  transition: background .15s, color .15s;
  user-select: none;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
.nav-badge {
  margin-left: auto;
  background: var(--primary);
  color: white;
  font-size: 11px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 99px;
}

.subject-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.sidebar-footer {
  margin-top: auto;
  padding: 12px;
  border-top: 1px solid var(--border);
}

/* ── Topbar ── */
.search-box {
  flex: 1;
  max-width: 400px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 12px;
  font-size: 14px;
  color: var(--text2);
  cursor: text;
}
.icon-btn {
  width: 36px; height: 36px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text2);
  font-size: 18px;
  transition: background .15s;
}
.icon-btn:hover { background: var(--surface2); }

/* ── Cards ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow);
  transition: box-shadow .2s, transform .2s;
}
.card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }

/* ── Upload Zone ── */
#upload-zone {
  border: 2px dashed var(--border);
  border-radius: 20px;
  padding: 48px 24px;
  text-align: center;
  cursor: pointer;
  transition: all .25s;
  background: var(--surface);
  position: relative;
  overflow: hidden;
}
#upload-zone:hover, #upload-zone.drag-over {
  border-color: var(--primary);
  background: var(--primary-light);
}
#upload-zone.drag-over { transform: scale(1.01); }
#upload-zone input { display: none; }

/* ── Progress / Analysis ── */
.progress-bar {
  height: 4px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #6366f1, #8b5cf6);
  border-radius: 99px;
  transition: width .4s ease;
}

/* ── Importance Badges ── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 600;
}
.badge-high { background: #fef2f2; color: #dc2626; }
.badge-medium { background: #fffbeb; color: #d97706; }
.badge-low { background: #f0fdf4; color: #16a34a; }
.dark .badge-high { background: #450a0a; color: #fca5a5; }
.dark .badge-medium { background: #451a03; color: #fcd34d; }
.dark .badge-low { background: #052e16; color: #86efac; }

/* ── Roadmap ── */
.roadmap-step {
  display: flex;
  gap: 16px;
  position: relative;
}
.roadmap-step:not(:last-child)::before {
  content: '';
  position: absolute;
  left: 19px;
  top: 40px;
  width: 2px;
  height: calc(100% + 8px);
  background: linear-gradient(to bottom, #6366f1, #c7d2fe);
}
.step-num {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white;
  font-size: 15px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}
.step-content { flex: 1; padding-bottom: 24px; }

/* ── Chat ── */
.chat-wrap {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 112px);
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.chat-bubble {
  max-width: 75%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.6;
  animation: slideUp .3s ease;
}
.chat-bubble.user {
  align-self: flex-end;
  background: var(--primary);
  color: white;
  border-bottom-right-radius: 4px;
}
.chat-bubble.ai {
  align-self: flex-start;
  background: var(--surface2);
  color: var(--text);
  border-bottom-left-radius: 4px;
}
.chat-input-bar {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}
.chat-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: border .2s;
  font-family: inherit;
}
.chat-input:focus { border-color: var(--primary); }
.chat-send {
  width: 42px; height: 42px;
  background: var(--primary);
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.chat-send:hover { background: #4f46e5; }

/* ── Timeline ── */
.timeline-item {
  display: flex;
  gap: 16px;
  padding-bottom: 24px;
  position: relative;
}
.timeline-item:not(:last-child)::before {
  content: '';
  position: absolute;
  left: 15px;
  top: 32px;
  width: 2px;
  height: calc(100% - 8px);
  background: var(--border);
}
.tl-dot {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}

/* ── D-Day ── */
.dday-ring {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: conic-gradient(var(--primary) 0% 70%, var(--border) 70% 100%);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.dday-inner {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: var(--surface);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}

/* ── Animations ── */
@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes pulse-ring {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .6; transform: scale(1.05); }
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.animate-slide-up { animation: slideUp .35s ease both; }
.animate-fade { animation: fadeIn .3s ease; }
.animate-spin { animation: spin .8s linear infinite; }

.skeleton {
  background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 6px;
}

/* Analyzing steps animation */
.analysis-step { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text2); opacity: 0; transition: opacity .3s; }
.analysis-step.visible { opacity: 1; }
.analysis-step.done { color: #16a34a; }
.analysis-step.active { color: var(--primary); }
.step-spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; }
.step-check { width: 16px; height: 16px; background: #16a34a; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; }

/* ── Keyword tags ── */
.keyword-tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  background: var(--primary-light);
  color: var(--primary);
  border-radius: 99px;
  font-size: 12px;
  font-weight: 500;
}

/* ── Stat card ── */
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* Mobile overlay */
#sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 40;
}

/* ── Exam Eve Mode ── */
#exam-eve-overlay {
  position: fixed; inset: 0;
  background: #09090f;
  z-index: 300;
  overflow-y: auto;
}
.eve-section-label {
  color: rgba(255,255,255,.35);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-bottom: 14px;
}
.eve-card {
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 14px;
  padding: 18px;
  transition: background .2s, border-color .2s;
}
.eve-card:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.14); }

/* ── Probability bars (animated) ── */
@keyframes fillIn { from { width: 0; } }
.prob-bar-fill { animation: fillIn .9s cubic-bezier(.4,0,.2,1) forwards; }

/* ── Streak ── */
.streak-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: linear-gradient(135deg, #f97316, #ef4444);
  color: white; font-size: 12px; font-weight: 700;
  padding: 4px 10px; border-radius: 99px;
}

/* ── Exam Eve CTA button ── */
.eve-cta {
  background: linear-gradient(135deg, #dc2626, #ef4444);
  color: white; font-weight: 700; font-size: 14px;
  padding: 13px 24px; border-radius: 13px; border: none;
  cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  transition: all .2s; font-family: inherit;
  box-shadow: 0 4px 20px rgba(239,68,68,.35);
}
.eve-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(239,68,68,.45); }

/* ── AI chip ── */
.ai-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--primary-light); color: var(--primary);
  font-size: 11px; font-weight: 700; padding: 3px 10px;
  border-radius: 99px; letter-spacing: .03em;
}

/* ── Today focus card ── */
.focus-gradient {
  background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
  border: 1px solid rgba(129,140,248,.25);
  border-radius: 16px; padding: 20px; position: relative; overflow: hidden;
}
.focus-gradient::before {
  content: ''; position: absolute; top: -40px; right: -40px;
  width: 160px; height: 160px;
  background: radial-gradient(circle, rgba(129,140,248,.15) 0%, transparent 70%);
}

/* ── Danger concept card ── */
.danger-card {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-radius: 12px;
  background: rgba(239,68,68,.06); border: 1px solid rgba(239,68,68,.15);
  transition: background .2s;
}
.danger-card:hover { background: rgba(239,68,68,.1); }

/* ── Formula display ── */
.formula-block {
  font-family: 'SFMono-Regular', Consolas, monospace;
  font-size: 15px; font-weight: 600;
  background: var(--surface2); color: var(--primary);
  padding: 10px 14px; border-radius: 8px;
  border: 1px solid var(--border); letter-spacing: -.01em;
}

/* ── Settings Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn .2s ease;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px;
  width: 90%; max-width: 500px;
  box-shadow: var(--shadow-lg);
  max-height: 90vh;
  overflow-y: auto;
}

/* ── Quiz ── */
.quiz-option {
  display: block;
  width: 100%;
  text-align: left;
  padding: 13px 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  transition: all .15s;
  font-family: inherit;
  margin-bottom: 8px;
  line-height: 1.5;
}
.quiz-option:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); }
.quiz-option.correct { border-color: #16a34a !important; background: #f0fdf4 !important; color: #16a34a !important; font-weight: 600; }
.quiz-option.wrong { border-color: #ef4444 !important; background: #fef2f2 !important; color: #ef4444 !important; }
.quiz-option.reveal { border-color: #16a34a !important; background: #f0fdf4 !important; color: #16a34a !important; }
.dark .quiz-option.correct { background: #052e16 !important; }
.dark .quiz-option.wrong { background: #450a0a !important; }
.dark .quiz-option.reveal { background: #052e16 !important; }

/* ── Notes ── */
.note-editor {
  width: 100%;
  min-height: 200px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  font-size: 14px;
  color: var(--text);
  font-family: inherit;
  line-height: 1.8;
  resize: vertical;
  outline: none;
  transition: border .2s;
}
.note-editor:focus { border-color: var(--primary); background: var(--surface); }

/* ── Review ── */
.review-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 10px;
  transition: box-shadow .2s;
}
.review-item:hover { box-shadow: var(--shadow-lg); }
.review-due { border-left: 4px solid #f59e0b; }
.review-overdue { border-left: 4px solid #ef4444; }
.review-done { border-left: 4px solid #16a34a; opacity: .7; }

/* ── API dot ── */
.api-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.api-dot.on { background: #16a34a; box-shadow: 0 0 0 2px #bbf7d0; }
.api-dot.off { background: #94a3b8; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* File type colors */
.type-pdf { color: #ef4444; }
.type-ppt { color: #f97316; }
.type-mp3 { color: #8b5cf6; }
.type-mp4 { color: #ec4899; }
.type-docx { color: #3b82f6; }
.type-txt { color: #6b7280; }
.type-img { color: #10b981; }

/* Mobile responsive */
@media (max-width: 768px) {
  #sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #sidebar-overlay { display: block; }
  #content { padding: 16px; }
  .grid-3 { grid-template-columns: 1fr !important; }
  .grid-2 { grid-template-columns: 1fr !important; }
}

/* View transitions */
.view { animation: slideUp .3s ease; }

/* Btn styles */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all .15s;
  font-family: inherit;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: #4f46e5; }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-sm { padding: 5px 12px; font-size: 13px; border-radius: 8px; }
</style>
</head>
<body>

<div id="app">
  <!-- Sidebar Overlay (mobile) -->
  <div id="sidebar-overlay" onclick="closeSidebar()" style="display:none"></div>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">✦</div>
      <span class="logo-text">StudyAI</span>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">메뉴</div>
      <div class="nav-item active" data-view="dashboard" onclick="navigate('dashboard',this)">
        <span class="icon">🏠</span> 대시보드
      </div>
      <div class="nav-item" data-view="upload" onclick="navigate('upload',this)">
        <span class="icon">⬆️</span> 파일 업로드
      </div>
      <div class="nav-item" data-view="materials" onclick="navigate('materials',this)">
        <span class="icon">📁</span> 내 자료
        <span class="nav-badge" id="materials-count">0</span>
      </div>
      <div class="nav-item" data-view="roadmap" onclick="navigate('roadmap',this)">
        <span class="icon">🗺️</span> 공부 로드맵
      </div>
      <div class="nav-item" data-view="timeline" onclick="navigate('timeline',this)">
        <span class="icon">📅</span> 타임라인
      </div>
      <div class="nav-item" data-view="chat" onclick="navigate('chat',this)">
        <span class="icon">🤖</span> AI 채팅
      </div>
      <div class="nav-item" data-view="quiz" onclick="navigate('quiz',this)">
        <span class="icon">📝</span> 퀴즈
      </div>
      <div class="nav-item" data-view="notes" onclick="navigate('notes',this)">
        <span class="icon">📓</span> 노트
      </div>
      <div class="nav-item" data-view="review" onclick="navigate('review',this)">
        <span class="icon">🔄</span> 복습 스케줄
        <span class="nav-badge" id="review-count" style="background:#f59e0b;display:none;">0</span>
      </div>
    </div>

    <div class="sidebar-section" id="subjects-sidebar">
      <div class="sidebar-label">과목</div>
      <!-- rendered by JS -->
    </div>

    <div class="sidebar-section">

function uid() { return 'mat_' + Math.random().toString(36).slice(2, 9); }
function fmt(date) {
  const d = new Date(date);
  return `${d.getMonth()+1}월 ${d.getDate()}일`;
}
function getDday() {
  if (!State.examDate) return null;
  const diff = Math.ceil((new Date(State.examDate) - new Date()) / 86400000);
  return diff;
}
function getFileExt(name) { return name.split('.').pop().toLowerCase(); }
function getFileIcon(ext) { return FILE_ICONS[ext] || '📄'; }
function inferSubject(name) {
  const n = name.toLowerCase();
  if (n.includes('경영') || n.includes('전략') || n.includes('마케팅')) return '경영학';
  if (n.includes('통계') || n.includes('확률') || n.includes('분포')) return '통계학';
  if (n.includes('경제') || n.includes('미시') || n.includes('거시')) return '경제학';
  if (n.includes('회계') || n.includes('재무') || n.includes('세무')) return '회계학';
  if (n.includes('파이썬') || n.includes('python') || n.includes('코딩') || n.includes('프로그래밍')) return '프로그래밍';
  if (n.includes('데이터') || n.includes('분석') || n.includes('머신')) return '데이터 분석';
  return '기타';
}
function subjectStyle(sub) {
  const m = SUBJECTS_META[sub] || SUBJECTS_META['기타'];
  const dark = document.documentElement.classList.contains('dark');
  return `background:${dark ? m.darkBg : m.bg};color:${m.color};`;
}

      { title: '3장: 종합 정리', importance: 'medium', summary: '전체 흐름 복습 및 예상 문제 대비' },
    ],
  };
}

// ────────────────────────────────────────────
// NAVIGATION
// ────────────────────────────────────────────
function navigate(view, el) {
  State.view = view;
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  if (el) el.classList.add('active');
  else {
    const target = document.querySelector(`[data-view="${view}"]`);
    if (target) target.classList.add('active');
  }
  renderView();
  closeSidebar();
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  sb.classList.toggle('open');
  ov.style.display = sb.classList.contains('open') ? 'block' : 'none';
}
function closeSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  sb.classList.remove('open');
  ov.style.display = 'none';
}
function focusSearch() { document.getElementById('search-input').focus(); }

// ────────────────────────────────────────────
// SIDEBAR UPDATES
// ────────────────────────────────────────────
function updateSidebar() {
  // materials count
  const count = State.materials.filter(m => m.status === 'complete').length;
  const badge = document.getElementById('materials-count');
  if (badge) badge.textContent = count;

  // subjects
  const subDiv = document.getElementById('subjects-sidebar');
  if (!subDiv) return;
  const subjects = State.getSubjects();
  if (Object.keys(subjects).length === 0) {
    subDiv.innerHTML = '<div class="sidebar-label">과목</div><div style="font-size:13px;color:var(--text2);padding:6px 10px;">없음</div>';
    return;
  }
  let html = '<div class="sidebar-label">과목</div>';
  Object.entries(subjects).forEach(([sub, cnt]) => {
    const m = SUBJECTS_META[sub] || SUBJECTS_META['기타'];
    html += `<div class="nav-item" onclick="filterBySubject('${sub}')">
      <span class="subject-dot" style="background:${m.color}"></span>
      <span>${m.emoji} ${sub}</span>
      <span style="margin-left:auto;font-size:12px;color:var(--text2);">${cnt}</span>
    </div>`;
  });
  subDiv.innerHTML = html;

  // favorites
  const favDiv = document.getElementById('fav-list');
  const favs = State.materials.filter(m => m.pinned && m.status === 'complete');
  if (!favDiv) return;
  if (favs.length === 0) {
    favDiv.innerHTML = '<div style="font-size:13px;color:var(--text2);padding:6px 10px;">없음</div>';
  } else {
    favDiv.innerHTML = favs.map(m => `
      <div class="nav-item" onclick="showMaterialDetail('${m.id}')">
        <span>${getFileIcon(m.type)}</span>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;">${m.name}</span>
      </div>`).join('');
  }
}

function filterBySubject(sub) {
  State.subjectFilter = sub;
  navigate('materials', null);
}

// ────────────────────────────────────────────
// VIEWS
// ────────────────────────────────────────────
function renderView() {
  const container = document.getElementById('content');
  container.innerHTML = '';
  container.className = 'view';
  switch (State.view) {
    case 'dashboard':  renderDashboard(container); break;
    case 'upload':     renderUpload(container); break;
    case 'materials':  renderMaterials(container); break;
    case 'roadmap':    renderRoadmap(container); break;
    case 'timeline':   renderTimeline(container); break;
    case 'chat':       renderChat(container); break;
    case 'detail':     renderDetail(container); break;
    case 'quiz':       renderQuiz(container); break;
    case 'notes':      renderNotes(container); break;
    case 'review':     renderReview(container); break;
  }
  container.style.cssText += 'flex:1;overflow-y:auto;padding:28px;';
}

        ondragover="event.preventDefault();document.getElementById('upload-zone').classList.add('drag-over')"

        ondrop="handleUploadDrop(event)">

        <div style="font-size:18px;font-weight:600;margin-bottom:8px;">파일을 여기에 드래그하세요</div>
        <div style="font-size:14px;color:var(--text2);margin-bottom:20px;">또는 클릭해서 파일 선택</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">
          ${['📄 PDF','📊 PPT','📝 DOCX','🎧 MP3','🎬 MP4','🖼️ 이미지'].map(t =>
            `<span style="padding:4px 12px;background:var(--surface2);border-radius:99px;font-size:13px;color:var(--text2);">${t}</span>`
          ).join('')}
        </div>
      </div>

      <!-- Upload Queue -->
      <div id="upload-queue" style="margin-top:24px;display:flex;flex-direction:column;gap:12px;"></div>

      <!-- Analyzing materials -->
      <div id="analyzing-list" style="margin-top:24px;"></div>
    </div>
  `;
}

function handleDrop(e) {
  e.preventDefault();
  const files = e.dataTransfer.files;
  if (files.length) {
    State.view = 'upload';
    navigate('upload', null);
    setTimeout(() => processFiles(files), 300);
  }
}
function handleUploadDrop(e) {
  e.preventDefault();
  document.getElementById('upload-zone').classList.remove('drag-over');
  processFiles(e.dataTransfer.files);
}
function handleFileSelect(files) { processFiles(files); }

function processFiles(files) {
  Array.from(files).forEach(file => {
    const ext = getFileExt(file.name);
    const mat = {
      id: uid(),
      name: file.name,
      type: ext,
      subject: inferSubject(file.name),
      uploadDate: new Date().toISOString().split('T')[0],
      size: file.size > 1024*1024 ? (file.size/1024/1024).toFixed(1)+'MB' : (file.size/1024).toFixed(0)+'KB',
      status: 'uploading',
      pinned: false,
      analysis: null,
    };
    State.materials.push(mat);
    State.save();
    updateSidebar();
    renderUploadItem(mat);
    simulateAnalysis(mat);
  });
}

function renderUploadItem(mat) {
  const queue = document.getElementById('upload-queue');
  if (!queue) return;
  const div = document.createElement('div');
  div.id = `upload-${mat.id}`;
  div.className = 'card';
  div.style.padding = '16px';
  div.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
      <span style="font-size:28px;">${getFileIcon(mat.type)}</span>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${mat.name}</div>
        <div style="font-size:12px;color:var(--text2);">${mat.size}</div>
      </div>
      <span id="status-${mat.id}" style="font-size:13px;color:var(--text2);">업로드 중...</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-${mat.id}" style="width:0%"></div></div>
    <div id="steps-${mat.id}" style="margin-top:12px;display:flex;flex-direction:column;gap:6px;"></div>
  `;
  queue.prepend(div);
}

function simulateAnalysis(mat) {
  const progEl = () => document.getElementById(`prog-${mat.id}`);
  const statusEl = () => document.getElementById(`status-${mat.id}`);
  const stepsEl = () => document.getElementById(`steps-${mat.id}`);

  // Phase 1: upload progress
  let p = 0;
  const upInterval = setInterval(() => {
    p += Math.random() * 15 + 5;
    if (p >= 100) {
      p = 100;
      clearInterval(upInterval);
      if (progEl()) progEl().style.width = '100%';
      if (statusEl()) statusEl().textContent = 'AI 분석 중...';
      // Phase 2: AI analysis steps
      setTimeout(() => runAnalysisSteps(mat), 400);
    }
    if (progEl()) progEl().style.width = Math.min(p, 100) + '%';
  }, 120);
}

function runAnalysisSteps(mat) {
  const stepsEl = document.getElementById(`steps-${mat.id}`);
  if (!stepsEl) return;
  ANALYSIS_STEPS.forEach((label, i) => {
    const div = document.createElement('div');
    div.className = 'analysis-step';
    div.id = `step-${mat.id}-${i}`;
    div.innerHTML = `<div class="step-spinner" id="spin-${mat.id}-${i}"></div><span>${label}</span>`;
    stepsEl.appendChild(div);
    setTimeout(() => {
      div.classList.add('visible', 'active');
      // Mark previous step done
      if (i > 0) {
        const prev = document.getElementById(`step-${mat.id}-${i-1}`);
        if (prev) {
          prev.classList.remove('active');
          prev.classList.add('done');
          const prevSpin = document.getElementById(`spin-${mat.id}-${i-1}`);
          if (prevSpin) prevSpin.outerHTML = '<div class="step-check">✓</div>';
        }
      }
      // Last step
      if (i === ANALYSIS_STEPS.length - 1) {
        setTimeout(() => {
          div.classList.remove('active');
          div.classList.add('done');
          const spin = document.getElementById(`spin-${mat.id}-${i}`);
          if (spin) spin.outerHTML = '<div class="step-check">✓</div>';
          finishAnalysis(mat);
        }, 500);
      }
    }, i * 600);
  });
}

function finishAnalysis(mat) {
  const idx = State.materials.findIndex(m => m.id === mat.id);
  if (idx < 0) return;
  State.materials[idx].status = 'complete';
  State.materials[idx].analysis = genMockAnalysis(mat.name, mat.type);
  State.materials[idx].subject = inferSubject(mat.name);
  State.save();
  updateSidebar();

  // Update card UI
  const statusEl = document.getElementById(`status-${mat.id}`);
  if (statusEl) {
    statusEl.innerHTML = '<span style="color:#16a34a;font-weight:600;">✓ 분석 완료</span>';
  }
  const card = document.getElementById(`upload-${mat.id}`);
  if (card) {
    card.style.borderColor = '#86efac';
    setTimeout(() => {
      if (card) card.style.borderColor = '';
    }, 2000);
  }

  // Show result button
  const stepsEl = document.getElementById(`steps-${mat.id}`);
  if (stepsEl) {
    const btn = document.createElement('button');
    btn.className = 'btn btn-primary btn-sm';
    btn.style.marginTop = '8px';

  }
}

function renderChatBubble(m) {
  return `<div class="chat-bubble ${m.role}" style="white-space:pre-line;">${m.text}</div>`;
}

function scrollChatToBottom() {
  const msgs = document.getElementById('chat-messages');
  if (msgs) msgs.scrollTop = msgs.scrollHeight;
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.disabled = true;
  State.chatMessages.push({ role: 'user', text });
  appendChatBubble({ role: 'user', text });

  // Typing indicator
  const typingId = 'typing-' + Date.now();
  const msgs = document.getElementById('chat-messages');
  if (msgs) {
    msgs.innerHTML += `<div id="${typingId}" class="chat-bubble ai" style="display:flex;gap:4px;align-items:center;">
      <div style="width:8px;height:8px;background:var(--text2);border-radius:50%;animation:pulse-ring 1s infinite;"></div>
      <div style="width:8px;height:8px;background:var(--text2);border-radius:50%;animation:pulse-ring 1s .2s infinite;"></div>
      <div style="width:8px;height:8px;background:var(--text2);border-radius:50%;animation:pulse-ring 1s .4s infinite;"></div>
    </div>`;
    scrollChatToBottom();
  }

  const reply = await getAIReply(text);
  const typing = document.getElementById(typingId);
  if (typing) typing.remove();
  State.chatMessages.push({ role: 'ai', text: reply });
  State.save();
  appendChatBubble({ role: 'ai', text: reply });
  if (input) input.disabled = false;
}

function sendQuickMsg(text) {
  const input = document.getElementById('chat-input');
  if (input) { input.value = text; sendChat(); }
  else {
    navigate('chat', null);
    setTimeout(() => { const inp = document.getElementById('chat-input'); if(inp){inp.value=text;sendChat();} }, 300);
  }
}

function appendChatBubble(m) {
  const msgs = document.getElementById('chat-messages');
  if (!msgs) return;
  const div = document.createElement('div');
  div.className = `chat-bubble ${m.role}`;
  div.style.whiteSpace = 'pre-line';
  div.textContent = m.text;
  msgs.appendChild(div);
  scrollChatToBottom();
}

async function getAIReply(text) {
  // Try OpenAI first
  if (getApiKey()) {
    const systemPrompt = `당신은 StudyAI 챗봇입니다. 사용자의 학습 자료를 기반으로 한국어로 간결하고 도움이 되는 답변을 제공하세요.\n\n현재 업로드된 학습 자료:\n${buildMaterialsContext()}\n\n시험 관련 질문에는 출제 확률이 높은 내용을 우선적으로 안내하고, 공부 계획 질문에는 구체적인 시간표를 제공하세요. 답변은 500자 이내로 핵심만 전달하세요.`;
    const messages = [
      { role: 'system', content: systemPrompt },
      ...State.chatMessages.slice(-6).map(m => ({ role: m.role === 'ai' ? 'assistant' : 'user', content: m.text })),
      { role: 'user', content: text },
    ];
    const res = await callOpenAI(messages, 600);
    if (res) return res;
  }

  // Fallback mock
  const t = text.toLowerCase();
  if (t.includes('시험') || t.includes('출제') || t.includes('중요')) return MOCK_CHAT['시험'];
  if (t.includes('요약') || t.includes('정리') || t.includes('핵심')) return MOCK_CHAT['요약'];
  if (t.includes('교수') || t.includes('강조') || t.includes('스타일')) return MOCK_CHAT['교수'];
  if (t.includes('오늘') || t.includes('플랜') || t.includes('공부')) return MOCK_CHAT['오늘'];
  if (t.includes('안녕') || t.includes('hello')) return '안녕하세요! 공부 자료에 대해 무엇이든 질문해보세요 😊\n업로드된 자료를 분석해서 최대한 도움드릴게요!\n\n💡 설정에서 OpenAI API 키를 입력하면 더 정확한 AI 응답을 받을 수 있어요.';
  return `"${text}"에 대해 분석해봤어요.\n\n현재 업로드된 ${State.materials.filter(m=>m.status==='complete').length}개 자료를 기반으로:\n\n• 가장 관련성 높은 자료: ${State.materials.find(m=>m.status==='complete')?.name || '없음'}\n• 핵심 키워드: ${State.materials.find(m=>m.analysis)?.analysis?.keywords?.slice(0,3).join(', ') || '없음'}\n\n💡 더 정확한 답변을 원하시면 설정(⚙️)에서 OpenAI API 키를 입력해보세요!`;
}

  State.chatMessages = [...DEFAULT_CHAT];

// OPENAI API
// ────────────────────────────────────────────
function getApiKey() { return localStorage.getItem('sa_apikey') || ''; }

async function callOpenAI(messages, maxTokens = 600) {
  const key = getApiKey();
  if (!key) return null;
  try {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({ model: 'gpt-4o-mini', messages, max_tokens: maxTokens, temperature: 0.7 }),
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || res.statusText); }
    const data = await res.json();
    return data.choices[0].message.content;
  } catch (e) {
    console.warn('OpenAI API error:', e.message);
    return null;
  }
}

function buildMaterialsContext() {
  const mats = State.materials.filter(m => m.status === 'complete');
  if (mats.length === 0) return '업로드된 자료 없음';
  return mats.map(m => `[${m.subject}] ${m.name}: ${m.analysis?.summary || ''} (키워드: ${m.analysis?.keywords?.join(', ') || ''})`).join('\n');
}

// REVIEW SCHEDULER (Ebbinghaus)
// ────────────────────────────────────────────
function markReviewed(matId) {
  const today = new Date().toISOString().split('T')[0];
  const r = State.reviews[matId] || { count: 0, lastDate: null, nextDate: null };
  r.count = (r.count || 0) + 1;
  r.lastDate = today;
  const interval = REVIEW_INTERVALS[Math.min(r.count - 1, REVIEW_INTERVALS.length - 1)];
  const next = new Date();
  next.setDate(next.getDate() + interval);
  r.nextDate = next.toISOString().split('T')[0];
  State.reviews[matId] = r;
  State.save();
  updateReviewBadge();
}

function getDueReviews() {
  const today = new Date().toISOString().split('T')[0];
  return State.materials.filter(m => {
    if (m.status !== 'complete') return false;
    const r = State.reviews[m.id];
    if (!r) return false;
    return r.nextDate && r.nextDate <= today;
  });
}

function getNewReviewCandidates() {
  return State.materials.filter(m => m.status === 'complete' && !State.reviews[m.id]);
}

function updateReviewBadge() {
  const due = getDueReviews();
  const badge = document.getElementById('review-count');
  if (!badge) return;
  if (due.length > 0) {
    badge.textContent = due.length;
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }
}

        if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); saveNote(m.id); }
      });
    });
  }, 0);
}

function getMockQuestions(mat) {

async function generateQuizWithAI(mat) {
  const context = `자료명: ${mat.name}\n과목: ${mat.subject}\n요약: ${mat.analysis?.summary}\n키워드: ${mat.analysis?.keywords?.join(', ')}`;
  const prompt = `다음 학습 자료를 기반으로 객관식 퀴즈 5문제를 만들어주세요.\n\n${context}\n\n형식 (JSON 배열로만 응답, 다른 텍스트 없이):\n[{"q":"문제","options":["선택지1","선택지2","선택지3","선택지4"],"answer":정답인덱스(0-3),"explain":"간단한 해설"}]`;
  try {
    const res = await callOpenAI([{ role: 'user', content: prompt }], 1000);
    if (!res) return null;
    const json = res.match(/\[[\s\S]*\]/)?.[0];
    if (!json) return null;
    return JSON.parse(json);
  } catch { return null; }
}

function answerQuiz(idx) {
  const qs = State.quizState;
  if (!qs) return;
  const q = qs.questions[qs.current];
  qs.answers[qs.current] = idx;
  const isCorrect = idx === q.answer;
  if (isCorrect) qs.score++;

  // Show result visually
  const btns = document.querySelectorAll('.quiz-option');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('correct');
    else if (i === idx && !isCorrect) btn.classList.add('wrong');
  });

  // Auto advance after 1.2s
  setTimeout(() => {
    qs.current++;
    renderView();
  }, 1200);
}

function getStreak() {
  const today = new Date().toISOString().split('T')[0];
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  let s = JSON.parse(localStorage.getItem('sa_streak') || '{"count":0,"lastDate":null}');
  if (s.lastDate === today) return s.count;
  if (s.lastDate === yesterday) {
    s.count++;
  } else {
    s.count = 1;
  }
  s.lastDate = today;
  localStorage.setItem('sa_streak', JSON.stringify(s));
  return s.count;
}

function updateStreakBadge() {
  const count = getStreak();
  const badge = document.getElementById('streak-badge');
  const num = document.getElementById('streak-count');
  if (!badge || !num) return;
  num.textContent = count;
  badge.style.display = count >= 2 ? '' : 'none';
}

// ────────────────────────────────────────────
function getDailyFocus() {
  const mats = State.materials.filter(m => m.status === 'complete');
  if (mats.length === 0) return null;
  // Find weakest (lowest examProb that isn't reviewed today)
  const today = new Date().toISOString().split('T')[0];
  const unreviewed = mats.filter(m => !State.reviews[m.id] || State.reviews[m.id].lastDate !== today);
  if (unreviewed.length === 0) return mats[0];
  // Sort: high importance first, then by examProb desc
  const sorted = [...unreviewed].sort((a,b) => {
    const impOrder = { high: 3, medium: 2, low: 1 };
    const ia = impOrder[a.analysis?.importance||'low'];
    const ib = impOrder[b.analysis?.importance||'low'];
    if (ia !== ib) return ib - ia;
    return (b.analysis?.examProb||0) - (a.analysis?.examProb||0);
  });
  return sorted[0];
}

function getAllDangerConcepts() {
  return State.materials
    .filter(m => m.status === 'complete' && m.analysis?.dangerConcepts?.length)
    .flatMap(m => m.analysis.dangerConcepts.map(c => ({ concept: c, subject: m.subject, matId: m.id })))
    .slice(0, 6);
}

async function renderExamEveContent() {
  const el = document.getElementById('eve-content');
  if (!el) return;
  const mats = State.materials.filter(m => m.status === 'complete');

  if (mats.length === 0) {
    el.innerHTML = `<div style="text-align:center;padding:100px 20px;">
      <div style="font-size:48px;margin-bottom:16px;opacity:.4;">📂</div>
      <div style="color:rgba(255,255,255,.5);font-size:16px;">자료를 먼저 업로드해주세요</div>
      <button onclick="exitExamEve();navigate('upload',null);" style="margin-top:20px;background:#6366f1;color:white;border:none;padding:10px 24px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px;">자료 업로드하기</button>
    </div>`;
    return;
  }

  // Loading state
  el.innerHTML = `<div style="text-align:center;padding:100px 20px;">
    <div style="font-size:52px;margin-bottom:20px;animation:pulse-ring .8s infinite;">⚡</div>
    <div style="color:white;font-size:20px;font-weight:700;margin-bottom:8px;">AI 브리핑 생성 중</div>
    <div style="color:rgba(255,255,255,.35);font-size:14px;margin-bottom:24px;">모든 자료를 분석해 핵심만 추리는 중...</div>
    <div style="display:flex;flex-direction:column;gap:8px;max-width:320px;margin:0 auto;text-align:left;">
      ${['반복 출제 패턴 감지 중', '교수 강조 표현 추출 중', '시험 확률 최종 계산 중', '브리핑 카드 생성 중'].map((s,i)=>`
        <div style="display:flex;align-items:center;gap:10px;opacity:0;animation:slideUp .4s ${i*.15}s ease both;">
          <div style="width:6px;height:6px;border-radius:50%;background:#818cf8;flex-shrink:0;"></div>
          <span style="color:rgba(255,255,255,.4);font-size:13px;">${s}</span>
        </div>`).join('')}
    </div>
  </div>`;

  // Try GPT briefing if API key set
  await new Promise(r => setTimeout(r, 1200));
  let gptInsight = null;
  if (getApiKey()) {
    const ctx = mats.map(m=>`[${m.subject}] ${m.name}: ${m.analysis?.summary}`).join('\n');
    const prompt = `다음 학습 자료들을 분석해 시험 직전 브리핑을 제공해. 한국어, 간결하게.\n\n${ctx}\n\nJSON 형식으로만 응답 (다른 텍스트 없이):\n{"headline":"AI가 파악한 이번 시험의 핵심 포인트 1문장","top3":"반드시 나와야 할 3가지 (bullet 형식, 각 줄 앞에 • 붙이기)","trap":"가장 많이 틀리는 함정 1가지 (한 문장)","lastHour":"시험 1시간 전 행동 지침 (2~3줄)"}`;
    try {
      const res = await callOpenAI([{role:'user',content:prompt}], 400);
      if (res) { const m = res.match(/\{[\s\S]*\}/); if (m) gptInsight = JSON.parse(m[0]); }
    } catch(e) {}
  }

  const sorted = [...mats].sort((a,b)=>(b.analysis?.examProb||0)-(a.analysis?.examProb||0));
  const allSubjects = [...new Set(mats.map(m=>m.subject))];
  const allDanger = getAllDangerConcepts();
  const allExpectedQ = mats.flatMap(m=>(m.analysis?.expectedQuestions||[]).map(q=>({q,subject:m.subject}))).slice(0,5);
  const allFormulas = mats.flatMap(m=>(m.analysis?.formulaCards||[]).map(f=>({...f,subject:m.subject}))).slice(0,8);

  el.innerHTML = `
    <!-- 타이틀 -->
    <div style="text-align:center;margin-bottom:40px;">
      <div style="display:inline-flex;align-items:center;gap:8px;background:rgba(129,140,248,.12);border:1px solid rgba(129,140,248,.25);padding:5px 16px;border-radius:99px;margin-bottom:16px;">
        <span style="width:6px;height:6px;border-radius:50%;background:#818cf8;"></span>
        <span style="color:#818cf8;font-size:12px;font-weight:700;">AI 분석 완료 — ${mats.length}개 자료 · ${allSubjects.length}개 과목</span>
      </div>
      <h1 style="color:white;font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1.2;margin-bottom:10px;">시험 직전 브리핑</h1>
      <p style="color:rgba(255,255,255,.35);font-size:14px;">모든 자료를 분석해 시험에 나올 핵심만 추렸어요</p>
    </div>

    ${gptInsight ? `
    <!-- GPT 실시간 인사이트 -->
    <div style="background:rgba(129,140,248,.08);border:1px solid rgba(129,140,248,.2);border-radius:16px;padding:22px;margin-bottom:28px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
        <span style="font-size:16px;">🤖</span>
        <span style="color:#818cf8;font-size:12px;font-weight:700;letter-spacing:.04em;">GPT LIVE 분석</span>
        <span style="background:#818cf8;color:white;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;">실시간</span>
      </div>
      <div style="color:white;font-size:16px;font-weight:700;margin-bottom:12px;line-height:1.5;">${gptInsight.headline||''}</div>
      <div style="color:rgba(255,255,255,.7);font-size:14px;line-height:1.9;white-space:pre-line;margin-bottom:${gptInsight.trap?'14px':'0'};">${gptInsight.top3||''}</div>
      ${gptInsight.trap?`<div style="background:rgba(239,68,68,.12);border-left:3px solid #ef4444;padding:10px 14px;border-radius:0 8px 8px 0;color:#fca5a5;font-size:13px;">⚠️ 함정 주의: ${gptInsight.trap}</div>`:''}
    </div>` : ''}

    <!-- 출제 확률 TOP -->
    <div style="margin-bottom:32px;">
      <div class="eve-section-label">🔥 시험 출제 확률 분석</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${sorted.map((m, i) => {
          const prob = m.analysis?.examProb || 0;
          const color = prob>=85?'#34d399':prob>=70?'#fbbf24':'rgba(255,255,255,.3)';
          const barColor = prob>=85?'linear-gradient(90deg,#34d399,#10b981)':prob>=70?'linear-gradient(90deg,#fbbf24,#f59e0b)':'rgba(255,255,255,.15)';
          const meta = SUBJECTS_META[m.subject]||SUBJECTS_META['기타'];
          return `
          <div class="eve-card" onclick="exitExamEve();showMaterialDetail('${m.id}')" style="cursor:pointer;">
            <div style="display:flex;align-items:center;gap:14px;">
              <div style="width:26px;text-align:center;color:${i<3?'#fbbf24':'rgba(255,255,255,.2)'};font-size:14px;font-weight:800;flex-shrink:0;">${i+1}</div>
              <div style="flex:1;min-width:0;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px;">
                  <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                    <span style="color:rgba(255,255,255,.85);font-size:14px;font-weight:600;">${m.name.replace(/\.[^/.]+$/,'')}</span>
                    <span style="color:rgba(255,255,255,.3);font-size:12px;margin-left:8px;">${meta.emoji} ${m.subject}</span>
                  </div>
                  <span style="color:${color};font-size:15px;font-weight:800;flex-shrink:0;">${prob}%</span>
                </div>
                <div style="height:4px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;">
                  <div class="prob-bar-fill" style="height:100%;width:${prob}%;background:${barColor};border-radius:99px;"></div>
                </div>
                ${m.analysis?.summary?`<div style="color:rgba(255,255,255,.3);font-size:12px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${m.analysis.summary.slice(0,80)}...</div>`:''}
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- 과목별 핵심 요약 -->
    <div style="margin-bottom:32px;">
      <div class="eve-section-label">📚 과목별 핵심 요약</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;">
        ${allSubjects.map(sub => {
          const subMats = mats.filter(m=>m.subject===sub);
          const kws = [...new Set(subMats.flatMap(m=>m.analysis?.keywords||[]))].slice(0,7);
          const maxProb = Math.max(...subMats.map(m=>m.analysis?.examProb||0));
          const meta = SUBJECTS_META[sub]||SUBJECTS_META['기타'];
          const style = subMats[0]?.analysis?.professorStyle||'';
          return `
          <div class="eve-card">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
              <span style="color:white;font-size:14px;font-weight:700;">${meta.emoji} ${sub}</span>
              <span style="color:${maxProb>=85?'#34d399':'rgba(255,255,255,.3)'};font-size:13px;font-weight:700;">${maxProb}%</span>
            </div>
            ${style?`<div style="color:rgba(255,255,255,.35);font-size:11px;margin-bottom:10px;line-height:1.5;">${style}</div>`:''}
            <div style="display:flex;flex-wrap:wrap;gap:5px;">
              ${kws.map(k=>`<span style="font-size:11px;padding:3px 9px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);border-radius:99px;">${k}</span>`).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- 위험 개념 (자주 틀리는 것) -->
    ${allDanger.length>0?`
    <div style="margin-bottom:32px;">
      <div class="eve-section-label">⚠️ 가장 많이 틀리는 함정 개념</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${allDanger.map((d,i)=>{
          const meta = SUBJECTS_META[d.subject]||SUBJECTS_META['기타'];
          return `
          <div style="display:flex;align-items:center;gap:12px;padding:13px 16px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.14);border-radius:12px;">
            <span style="color:#ef4444;font-size:14px;font-weight:800;flex-shrink:0;">${i+1}</span>
            <div style="flex:1;">
              <span style="color:rgba(255,255,255,.8);font-size:13px;">${d.concept}</span>
              <span style="color:rgba(255,255,255,.25);font-size:11px;margin-left:8px;">${meta.emoji} ${d.subject}</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`:''}

    <!-- 예상 서술형 문제 -->
    ${allExpectedQ.length>0?`
    <div style="margin-bottom:32px;">
      <div class="eve-section-label">🧠 AI 예상 서술형 문제</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${allExpectedQ.map((item,i)=>{
          const meta = SUBJECTS_META[item.subject]||SUBJECTS_META['기타'];
          return `
          <div class="eve-card">
            <div style="display:flex;gap:12px;">
              <span style="color:#818cf8;font-size:12px;font-weight:700;flex-shrink:0;padding-top:1px;">Q${i+1}</span>
              <div>
                <div style="color:rgba(255,255,255,.8);font-size:14px;line-height:1.7;margin-bottom:6px;">${item.q}</div>
                <span style="font-size:11px;padding:2px 8px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.35);border-radius:99px;">${meta.emoji} ${item.subject}</span>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`:''}

    <!-- 암기 필수 공식 -->
    ${allFormulas.length>0?`
    <div style="margin-bottom:32px;">
      <div class="eve-section-label">📌 암기 필수 공식</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;">
        ${allFormulas.map(f=>`
          <div class="eve-card">
            <div style="color:rgba(255,255,255,.4);font-size:11px;font-weight:600;margin-bottom:8px;">${f.title}</div>
            <div style="font-family:monospace;font-size:13px;font-weight:700;color:#a5b4fc;background:rgba(129,140,248,.1);padding:10px 12px;border-radius:8px;margin-bottom:8px;line-height:1.6;">${f.formula}</div>
            ${f.note?`<div style="color:rgba(255,255,255,.3);font-size:11px;line-height:1.5;">${f.note}</div>`:''}
          </div>`).join('')}
      </div>
    </div>`:''}

    <!-- 마지막 조언 -->
    <div style="background:rgba(129,140,248,.06);border:1px solid rgba(129,140,248,.15);border-radius:18px;padding:24px;text-align:center;margin-bottom:20px;">
      <div style="font-size:24px;margin-bottom:12px;">🎯</div>
      <div style="color:white;font-size:16px;font-weight:700;margin-bottom:8px;">시험 당일 최종 전략</div>
      <div style="color:rgba(255,255,255,.45);font-size:13px;line-height:1.9;max-width:500px;margin:0 auto;">
        ${gptInsight?.lastHour || '새로운 내용 공부는 금물 — 고중요도 자료만 빠르게 훑기\n공식은 마지막으로 손으로 직접 써보기\n예상 서술형 핵심 포인트 재확인 후 입장'}
      </div>
    </div>
    <div style="height:60px;"></div>
  `;
}

// ────────────────────────────────────────────
// SEARCH
// ────────────────────────────────────────────
function handleSearch(query) {
  if (!query) return;
  const q = query.toLowerCase();
  const results = State.materials.filter(m =>
    m.status === 'complete' && (
      m.name.toLowerCase().includes(q) ||
      m.subject.toLowerCase().includes(q) ||
      m.analysis?.summary.toLowerCase().includes(q) ||
      m.analysis?.keywords.some(k => k.toLowerCase().includes(q))
    )
  );
  if (State.view !== 'materials') {
    State.subjectFilter = 'all';
    navigate('materials', null);
  }
}

// ────────────────────────────────────────────
// EXAM DATE
// ────────────────────────────────────────────
function setExamDate() {
  const date = prompt('시험 날짜를 입력하세요 (예: 2026-06-20)');
  if (date && /^\d{4}-\d{2}-\d{2}$/.test(date)) {
    State.examDate = date;
    State.save();
    renderView();
  } else if (date) {
    alert('날짜 형식이 올바르지 않아요. YYYY-MM-DD 형식으로 입력해주세요.');
  }
}
function changeExamDate() { setExamDate(); }

// ────────────────────────────────────────────
// DARK MODE
// ────────────────────────────────────────────
function toggleDark() {
  State.darkMode = !State.darkMode;
  document.documentElement.classList.toggle('dark', State.darkMode);
  const icon = document.getElementById('dark-icon');
  const label = document.getElementById('dark-label');
  if (icon) icon.textContent = State.darkMode ? '☀️' : '🌙';
  if (label) label.textContent = State.darkMode ? '라이트 모드' : '다크 모드';
  State.save();
}

// ────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────
function init() {
  State.load();

  // Dark mode
  document.documentElement.classList.toggle('dark', State.darkMode);
  const icon = document.getElementById('dark-icon');
  const label = document.getElementById('dark-label');
  if (icon) icon.textContent = State.darkMode ? '☀️' : '🌙';
  if (label) label.textContent = State.darkMode ? '라이트 모드' : '다크 모드';

  // Today date
  const today = document.getElementById('today-date');
  if (today) {
    const d = new Date();
    today.textContent = `${d.getMonth()+1}/${d.getDate()}`;
  }

  // Render
  updateSidebar();
  updateReviewBadge();
  updateApiDot();
  updateStreakBadge();
  renderView();

  // Drag & drop on whole window
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    if (e.dataTransfer.files.length) handleDrop(e);
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
