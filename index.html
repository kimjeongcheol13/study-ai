<!DOCTYPE html>
<html lang="ko" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyAI — AI 공부 매니저</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['"Noto Sans KR"', 'sans-serif'] }
      }
    }
  };
</script>
<style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface2: #f1f5f9;
  --border: #e2e8f0;
  --text: #0f172a;
  --text2: #64748b;
  --primary: #6366f1;
  --primary-light: #eef2ff;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.05);
}
.dark {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --primary-light: #1e1b4b;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background .3s, color .3s;
  overflow-x: hidden;
}

/* ── Layout ── */
#app { display: flex; height: 100vh; overflow: hidden; }

#sidebar {
  width: 240px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  transition: transform .3s, width .3s;
}

#main-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#topbar {
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 12px;
  flex-shrink: 0;
}

#content {
  flex: 1;
  overflow-y: auto;
  padding: 28px;
}

/* ── Sidebar ── */
.sidebar-logo {
  padding: 20px 16px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}
.logo-mark {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.logo-text { font-weight: 700; font-size: 16px; }

.sidebar-section { padding: 12px 8px 4px; }
.sidebar-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 0 8px;
  margin-bottom: 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text2);
  transition: background .15s, color .15s;
  user-select: none;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
.nav-badge {
  margin-left: auto;
  background: var(--primary);
  color: white;
  font-size: 11px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 99px;
}

.subject-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.sidebar-footer {
  margin-top: auto;
  padding: 12px;
  border-top: 1px solid var(--border);
}

/* ── Topbar ── */
.search-box {
  flex: 1;
  max-width: 400px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 12px;
  font-size: 14px;
  color: var(--text2);
  cursor: text;
}
.icon-btn {
  width: 36px; height: 36px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text2);
  font-size: 18px;
  transition: background .15s;
}
.icon-btn:hover { background: var(--surface2); }

/* ── Cards ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow);
  transition: box-shadow .2s, transform .2s;
}
.card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }

/* ── Upload Zone ── */
#upload-zone {
  border: 2px dashed var(--border);
  border-radius: 20px;
  padding: 48px 24px;
  text-align: center;
  cursor: pointer;
  transition: all .25s;
  background: var(--surface);
  position: relative;
  overflow: hidden;
}
#upload-zone:hover, #upload-zone.drag-over {
  border-color: var(--primary);
  background: var(--primary-light);
}
#upload-zone.drag-over { transform: scale(1.01); }
#upload-zone input { display: none; }

/* ── Progress / Analysis ── */
.progress-bar {
  height: 4px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #6366f1, #8b5cf6);
  border-radius: 99px;
  transition: width .4s ease;
}

/* ── Importance Badges ── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 600;
}
.badge-high { background: #fef2f2; color: #dc2626; }
.badge-medium { background: #fffbeb; color: #d97706; }
.badge-low { background: #f0fdf4; color: #16a34a; }
.dark .badge-high { background: #450a0a; color: #fca5a5; }
.dark .badge-medium { background: #451a03; color: #fcd34d; }
.dark .badge-low { background: #052e16; color: #86efac; }

/* ── Roadmap ── */
.roadmap-step {
  display: flex;
  gap: 16px;
  position: relative;
}
.roadmap-step:not(:last-child)::before {
  content: '';
  position: absolute;
  left: 19px;
  top: 40px;
  width: 2px;
  height: calc(100% + 8px);
  background: linear-gradient(to bottom, #6366f1, #c7d2fe);
}
.step-num {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white;
  font-size: 15px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}
.step-content { flex: 1; padding-bottom: 24px; }

/* ── Chat ── */
.chat-wrap {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 112px);
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.chat-bubble {
  max-width: 75%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.6;
  animation: slideUp .3s ease;
}
.chat-bubble.user {
  align-self: flex-end;
  background: var(--primary);
  color: white;
  border-bottom-right-radius: 4px;
}
.chat-bubble.ai {
  align-self: flex-start;
  background: var(--surface2);
  color: var(--text);
  border-bottom-left-radius: 4px;
}
.chat-input-bar {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}
.chat-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: border .2s;
  font-family: inherit;
}
.chat-input:focus { border-color: var(--primary); }
.chat-send {
  width: 42px; height: 42px;
  background: var(--primary);
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.chat-send:hover { background: #4f46e5; }

/* ── Timeline ── */
.timeline-item {
  display: flex;
  gap: 16px;
  padding-bottom: 24px;
  position: relative;
}
.timeline-item:not(:last-child)::before {
  content: '';
  position: absolute;
  left: 15px;
  top: 32px;
  width: 2px;
  height: calc(100% - 8px);
  background: var(--border);
}
.tl-dot {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}

/* ── D-Day ── */
.dday-ring {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: conic-gradient(var(--primary) 0% 70%, var(--border) 70% 100%);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.dday-inner {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: var(--surface);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}

/* ── Animations ── */
@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes pulse-ring {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .6; transform: scale(1.05); }
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.animate-slide-up { animation: slideUp .35s ease both; }
.animate-fade { animation: fadeIn .3s ease; }
.animate-spin { animation: spin .8s linear infinite; }

.skeleton {
  background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 6px;
}

/* Analyzing steps animation */
.analysis-step { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text2); opacity: 0; transition: opacity .3s; }
.analysis-step.visible { opacity: 1; }
.analysis-step.done { color: #16a34a; }
.analysis-step.active { color: var(--primary); }
.step-spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; }
.step-check { width: 16px; height: 16px; background: #16a34a; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; }

/* ── Keyword tags ── */
.keyword-tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  background: var(--primary-light);
  color: var(--primary);
  border-radius: 99px;
  font-size: 12px;
  font-weight: 500;
}

/* ── Stat card ── */
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* Mobile overlay */
#sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 40;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* File type colors */
.type-pdf { color: #ef4444; }
.type-ppt { color: #f97316; }
.type-mp3 { color: #8b5cf6; }
.type-mp4 { color: #ec4899; }
.type-docx { color: #3b82f6; }
.type-txt { color: #6b7280; }
.type-img { color: #10b981; }

/* Mobile responsive */
@media (max-width: 768px) {
  #sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #sidebar-overlay { display: block; }
  #content { padding: 16px; }
  .grid-3 { grid-template-columns: 1fr !important; }
  .grid-2 { grid-template-columns: 1fr !important; }
}

/* View transitions */
.view { animation: slideUp .3s ease; }

/* Btn styles */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all .15s;
  font-family: inherit;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: #4f46e5; }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-sm { padding: 5px 12px; font-size: 13px; border-radius: 8px; }
</style>
</head>
<body>

<div id="app">
  <!-- Sidebar Overlay (mobile) -->
  <div id="sidebar-overlay" onclick="closeSidebar()" style="display:none"></div>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">✦</div>
      <span class="logo-text">StudyAI</span>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">메뉴</div>
      <div class="nav-item active" data-view="dashboard" onclick="navigate('dashboard',this)">
        <span class="icon">🏠</span> 대시보드
      </div>
      <div class="nav-item" data-view="upload" onclick="navigate('upload',this)">
        <span class="icon">⬆️</span> 파일 업로드
      </div>
      <div class="nav-item" data-view="materials" onclick="navigate('materials',this)">
        <span class="icon">📁</span> 내 자료
        <span class="nav-badge" id="materials-count">0</span>
      </div>
      <div class="nav-item" data-view="roadmap" onclick="navigate('roadmap',this)">
        <span class="icon">🗺️</span> 공부 로드맵
      </div>
      <div class="nav-item" data-view="timeline" onclick="navigate('timeline',this)">
        <span class="icon">📅</span> 타임라인
      </div>
      <div class="nav-item" data-view="chat" onclick="navigate('chat',this)">
        <span class="icon">🤖</span> AI 채팅
      </div>
    </div>

    <div class="sidebar-section" id="subjects-sidebar">
      <div class="sidebar-label">과목</div>
      <!-- rendered by JS -->
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">즐겨찾기</div>
      <div id="fav-list">
        <div style="font-size:13px;color:var(--text2);padding:6px 10px;">없음</div>
      </div>
    </div>

    <div class="sidebar-footer">
      <div style="font-size:12px;color:var(--text2);margin-bottom:8px;">오늘: <span id="today-date"></span></div>
      <div class="nav-item" onclick="toggleDark()" style="font-size:13px;">
        <span class="icon" id="dark-icon">🌙</span>
        <span id="dark-label">다크 모드</span>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div id="main-wrap">
    <!-- Topbar -->
    <header id="topbar">
      <button class="icon-btn" style="border:none;" onclick="toggleSidebar()" title="메뉴">☰</button>
      <div class="search-box" onclick="focusSearch()">
        <span>🔍</span>
        <input id="search-input" placeholder="자료 검색..." style="background:transparent;border:none;outline:none;font-size:14px;color:var(--text);flex:1;font-family:inherit;" oninput="handleSearch(this.value)">
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
        <button class="btn btn-primary btn-sm" onclick="navigate('upload',null)">+ 업로드</button>
        <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;" title="프로필">👤</div>
      </div>
    </header>

    <!-- Content -->
    <main id="content"></main>
  </div>
</div>

    }));

    const counts = {};
    this.materials.forEach(m => {

  },

function uid() { return 'mat_' + Math.random().toString(36).slice(2, 9); }
function fmt(date) {
  const d = new Date(date);
  return `${d.getMonth()+1}월 ${d.getDate()}일`;
}
function getDday() {
  if (!State.examDate) return null;
  const diff = Math.ceil((new Date(State.examDate) - new Date()) / 86400000);
  return diff;
}
function getFileExt(name) { return name.split('.').pop().toLowerCase(); }
function getFileIcon(ext) { return FILE_ICONS[ext] || '📄'; }
function inferSubject(name) {
  const n = name.toLowerCase();
  if (n.includes('경영') || n.includes('전략') || n.includes('마케팅')) return '경영학';
  if (n.includes('통계') || n.includes('확률') || n.includes('분포')) return '통계학';
  if (n.includes('경제') || n.includes('미시') || n.includes('거시')) return '경제학';
  if (n.includes('회계') || n.includes('재무') || n.includes('세무')) return '회계학';
  if (n.includes('파이썬') || n.includes('python') || n.includes('코딩') || n.includes('프로그래밍')) return '프로그래밍';
  if (n.includes('데이터') || n.includes('분석') || n.includes('머신')) return '데이터 분석';
  return '기타';
}
function subjectStyle(sub) {
  const m = SUBJECTS_META[sub] || SUBJECTS_META['기타'];
  const dark = document.documentElement.classList.contains('dark');
  return `background:${dark ? m.darkBg : m.bg};color:${m.color};`;
}

function navigate(view, el) {
  State.view = view;
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  if (el) el.classList.add('active');
  else {
    const target = document.querySelector(`[data-view="${view}"]`);
    if (target) target.classList.add('active');
  }
  renderView();
  closeSidebar();
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  sb.classList.toggle('open');
  ov.style.display = sb.classList.contains('open') ? 'block' : 'none';
}
function closeSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  sb.classList.remove('open');
  ov.style.display = 'none';
}
function focusSearch() { document.getElementById('search-input').focus(); }

function updateSidebar() {
  // materials count
  const count = State.materials.filter(m => m.status === 'complete').length;
  const badge = document.getElementById('materials-count');
  if (badge) badge.textContent = count;

  // subjects
  const subDiv = document.getElementById('subjects-sidebar');
  if (!subDiv) return;
  const subjects = State.getSubjects();
  if (Object.keys(subjects).length === 0) {
    subDiv.innerHTML = '<div class="sidebar-label">과목</div><div style="font-size:13px;color:var(--text2);padding:6px 10px;">없음</div>';
    return;
  }
  let html = '<div class="sidebar-label">과목</div>';
  Object.entries(subjects).forEach(([sub, cnt]) => {
    const m = SUBJECTS_META[sub] || SUBJECTS_META['기타'];
    html += `<div class="nav-item" onclick="filterBySubject('${sub}')">
      <span class="subject-dot" style="background:${m.color}"></span>
      <span>${m.emoji} ${sub}</span>
      <span style="margin-left:auto;font-size:12px;color:var(--text2);">${cnt}</span>
    </div>`;
  });
  subDiv.innerHTML = html;

  // favorites
  const favDiv = document.getElementById('fav-list');
  const favs = State.materials.filter(m => m.pinned && m.status === 'complete');
  if (!favDiv) return;
  if (favs.length === 0) {
    favDiv.innerHTML = '<div style="font-size:13px;color:var(--text2);padding:6px 10px;">없음</div>';
  } else {
    favDiv.innerHTML = favs.map(m => `
      <div class="nav-item" onclick="showMaterialDetail('${m.id}')">
        <span>${getFileIcon(m.type)}</span>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;">${m.name}</span>
      </div>`).join('');
  }
}

function filterBySubject(sub) {
  State.subjectFilter = sub;
  navigate('materials', null);
}

function renderView() {
  const container = document.getElementById('content');
  container.innerHTML = '';
  container.className = 'view';
  switch (State.view) {
    case 'dashboard':  renderDashboard(container); break;
    case 'upload':     renderUpload(container); break;
    case 'materials':  renderMaterials(container); break;
    case 'roadmap':    renderRoadmap(container); break;
    case 'timeline':   renderTimeline(container); break;
    case 'chat':       renderChat(container); break;
    case 'detail':     renderDetail(container); break;
  }

}

function handleDrop(e) {
  e.preventDefault();
  const files = e.dataTransfer.files;
  if (files.length) {
    State.view = 'upload';
    navigate('upload', null);
    setTimeout(() => processFiles(files), 300);
  }
}
function handleUploadDrop(e) {
  e.preventDefault();
  document.getElementById('upload-zone').classList.remove('drag-over');
  processFiles(e.dataTransfer.files);
}
function handleFileSelect(files) { processFiles(files); }

function processFiles(files) {
  Array.from(files).forEach(file => {
    const ext = getFileExt(file.name);
    const mat = {
      id: uid(),
      name: file.name,
      type: ext,
      subject: inferSubject(file.name),
      uploadDate: new Date().toISOString().split('T')[0],
      size: file.size > 1024*1024 ? (file.size/1024/1024).toFixed(1)+'MB' : (file.size/1024).toFixed(0)+'KB',
      status: 'uploading',
      pinned: false,
      analysis: null,
    };
    State.materials.push(mat);
    State.save();
    updateSidebar();
    renderUploadItem(mat);
    simulateAnalysis(mat);
  });
}

function renderUploadItem(mat) {
  const queue = document.getElementById('upload-queue');
  if (!queue) return;
  const div = document.createElement('div');
  div.id = `upload-${mat.id}`;
  div.className = 'card';
  div.style.padding = '16px';
  div.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
      <span style="font-size:28px;">${getFileIcon(mat.type)}</span>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${mat.name}</div>
        <div style="font-size:12px;color:var(--text2);">${mat.size}</div>
      </div>
      <span id="status-${mat.id}" style="font-size:13px;color:var(--text2);">업로드 중...</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-${mat.id}" style="width:0%"></div></div>
    <div id="steps-${mat.id}" style="margin-top:12px;display:flex;flex-direction:column;gap:6px;"></div>
  `;
  queue.prepend(div);
}

function simulateAnalysis(mat) {
  const progEl = () => document.getElementById(`prog-${mat.id}`);
  const statusEl = () => document.getElementById(`status-${mat.id}`);
  const stepsEl = () => document.getElementById(`steps-${mat.id}`);

  // Phase 1: upload progress
  let p = 0;
  const upInterval = setInterval(() => {
    p += Math.random() * 15 + 5;
    if (p >= 100) {
      p = 100;
      clearInterval(upInterval);
      if (progEl()) progEl().style.width = '100%';
      if (statusEl()) statusEl().textContent = 'AI 분석 중...';
      // Phase 2: AI analysis steps
      setTimeout(() => runAnalysisSteps(mat), 400);
    }
    if (progEl()) progEl().style.width = Math.min(p, 100) + '%';
  }, 120);
}

function runAnalysisSteps(mat) {
  const stepsEl = document.getElementById(`steps-${mat.id}`);
  if (!stepsEl) return;
  ANALYSIS_STEPS.forEach((label, i) => {
    const div = document.createElement('div');
    div.className = 'analysis-step';
    div.id = `step-${mat.id}-${i}`;
    div.innerHTML = `<div class="step-spinner" id="spin-${mat.id}-${i}"></div><span>${label}</span>`;
    stepsEl.appendChild(div);
    setTimeout(() => {
      div.classList.add('visible', 'active');
      // Mark previous step done
      if (i > 0) {
        const prev = document.getElementById(`step-${mat.id}-${i-1}`);
        if (prev) {
          prev.classList.remove('active');
          prev.classList.add('done');
          const prevSpin = document.getElementById(`spin-${mat.id}-${i-1}`);
          if (prevSpin) prevSpin.outerHTML = '<div class="step-check">✓</div>';
        }
      }
      // Last step
      if (i === ANALYSIS_STEPS.length - 1) {
        setTimeout(() => {
          div.classList.remove('active');
          div.classList.add('done');
          const spin = document.getElementById(`spin-${mat.id}-${i}`);
          if (spin) spin.outerHTML = '<div class="step-check">✓</div>';
          finishAnalysis(mat);
        }, 500);
      }
    }, i * 600);
  });
}

function finishAnalysis(mat) {
  const idx = State.materials.findIndex(m => m.id === mat.id);
  if (idx < 0) return;
  State.materials[idx].status = 'complete';
  State.materials[idx].analysis = genMockAnalysis(mat.name, mat.type);
  State.materials[idx].subject = inferSubject(mat.name);
  State.save();
  updateSidebar();

  // Update card UI
  const statusEl = document.getElementById(`status-${mat.id}`);
  if (statusEl) {
    statusEl.innerHTML = '<span style="color:#16a34a;font-weight:600;">✓ 분석 완료</span>';
  }
  const card = document.getElementById(`upload-${mat.id}`);
  if (card) {
    card.style.borderColor = '#86efac';
    setTimeout(() => {
      if (card) card.style.borderColor = '';
    }, 2000);
  }

  // Show result button
  const stepsEl = document.getElementById(`steps-${mat.id}`);
  if (stepsEl) {
    const btn = document.createElement('button');
    btn.className = 'btn btn-primary btn-sm';
    btn.style.marginTop = '8px';
    btn.textContent = '결과 보기 →';
    btn.onclick = () => showMaterialDetail(mat.id);
    stepsEl.appendChild(btn);
  }
}

                      <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface2);border-radius:8px;cursor:pointer;" onclick="showMaterialDetail('${m.id}')">
                        <span>${getFileIcon(m.type)}</span>
                        <span style="font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${m.name}</span>
                        <span style="font-size:12px;color:var(--primary);font-weight:600;">${m.analysis?.examProb||0}%</span>
                      </div>`).join('')}
                  </div>` : ''}
              </div>
            </div>
          </div>`).join('')}
      </div>

      <!-- Exam Tips -->
      <div class="card" style="padding:20px;margin-top:24px;background:linear-gradient(135deg,#fef9c3,#fefce8);border-color:#fde047;">
        <div style="font-size:15px;font-weight:700;margin-bottom:12px;color:#854d0e;">💡 AI 시험 전략 TIP</div>
        <ul style="font-size:14px;color:#713f12;line-height:1.8;padding-left:16px;">
          <li>경영학 SWOT·BCG는 반드시 손으로 직접 그려보며 외우세요</li>
          <li>통계학 t-test 공식은 유도 과정을 이해하면 암기가 쉬워요</li>
          <li>경제학 탄력성은 계산 문제 위주로 5문제 이상 풀어보세요</li>
          <li>시험 전날은 새 내용 NO — 고중요도 자료만 빠르게 복습</li>
        </ul>
      </div>
    </div>
  `;
}

// ── TIMELINE ───────────────────────────────
function renderTimeline(el) {
  const mats = State.materials.filter(m => m.status === 'complete')
    .sort((a,b) => new Date(a.uploadDate) - new Date(b.uploadDate));

  // Group by date
  const groups = {};
  mats.forEach(m => {
    const d = m.uploadDate;
    if (!groups[d]) groups[d] = [];
    groups[d].push(m);
  });

  el.innerHTML = `
    <div style="max-width:720px;margin:0 auto;">
      <div style="margin-bottom:24px;">
        <h2 style="font-size:22px;font-weight:700;margin-bottom:4px;">📅 자료 타임라인</h2>
        <p style="color:var(--text2);font-size:14px;">업로드 날짜 기준 전체 자료 흐름</p>
      </div>
      ${Object.keys(groups).length === 0
        ? '<div style="text-align:center;padding:60px 0;color:var(--text2);">아직 자료가 없어요</div>'
        : Object.entries(groups).map(([date, items]) => `
          <div style="margin-bottom:32px;">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
              <div style="font-size:14px;font-weight:700;color:var(--primary);">${fmt(date)}</div>
              <div style="flex:1;height:1px;background:var(--border);"></div>
              <div style="font-size:12px;color:var(--text2);">${items.length}개</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px;">
              ${items.map(m => {
                const sub = SUBJECTS_META[m.subject] || SUBJECTS_META['기타'];
                const imp = IMPORTANCE_LABELS[m.analysis?.importance||'low'];
                return `
                  <div class="timeline-item">
                    <div class="tl-dot">${getFileIcon(m.type)}</div>
                    <div class="card" style="flex:1;padding:14px;cursor:pointer;" onclick="showMaterialDetail('${m.id}')">
                      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;">
                        <div>
                          <div style="font-size:14px;font-weight:600;margin-bottom:4px;">${m.name}</div>
                          <div style="display:flex;gap:6px;align-items:center;">
                            <span style="font-size:11px;padding:2px 8px;border-radius:99px;${subjectStyle(m.subject)}">${sub.emoji} ${m.subject}</span>
                            <span style="font-size:12px;color:var(--text2);">${m.size}</span>
                          </div>
                        </div>
                        <span class="badge ${imp.badge}" style="flex-shrink:0;">${imp.label}</span>
                      </div>
                      ${m.analysis ? `
                        <p style="font-size:13px;color:var(--text2);margin-top:8px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${m.analysis.summary}</p>
                        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;">
                          ${m.analysis.keywords.slice(0,4).map(k=>`<span class="keyword-tag">${k}</span>`).join('')}
                        </div>
                      ` : ''}
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>`).join('')}
    </div>
  `;
}

// ── CHAT ───────────────────────────────────
function renderChat(el) {
  el.style.padding = '0';
  el.innerHTML = `
    <div class="chat-wrap">
      <!-- Chat Header -->
      <div style="padding:16px 20px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:12px;">
        <div style="width:36px;height:36px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;">🤖</div>
        <div>
          <div style="font-size:14px;font-weight:700;">StudyAI 챗봇</div>
          <div style="font-size:12px;color:var(--text2);">${State.materials.filter(m=>m.status==='complete').length}개 자료 기반 응답</div>
        </div>
        <button class="btn btn-secondary btn-sm" style="margin-left:auto;" onclick="clearChat()">초기화</button>
      </div>

      <!-- Quick Prompts -->
      <div style="padding:12px 16px;display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--surface);">
        ${[
          '시험 중요 부분 알려줘',
          '오늘 공부 플랜 짜줘',
          '교수님 강조 표현 분석해줘',
          '핵심 요약해줘',
        ].map(q => `<button class="btn btn-secondary btn-sm" style="white-space:nowrap;flex-shrink:0;" onclick="sendQuickMsg('${q}')">${q}</button>`).join('')}
      </div>

      <!-- Messages -->
      <div class="chat-messages" id="chat-messages">
        ${State.chatMessages.map(m => renderChatBubble(m)).join('')}
      </div>

      <!-- Input -->
      <div class="chat-input-bar">
        <textarea class="chat-input" id="chat-input" rows="1" placeholder="자료에 대해 질문하세요..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
        <button class="chat-send" onclick="sendChat()">➤</button>
      </div>
    </div>
  `;
  scrollChatToBottom();
}

function renderChatBubble(m) {
  return `<div class="chat-bubble ${m.role}" style="white-space:pre-line;">${m.text}</div>`;
}

function scrollChatToBottom() {
  const msgs = document.getElementById('chat-messages');
  if (msgs) msgs.scrollTop = msgs.scrollHeight;
}

function sendChat() {
  const input = document.getElementById('chat-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  State.chatMessages.push({ role: 'user', text });
  appendChatBubble({ role: 'user', text });

  // Typing indicator
  const typingId = 'typing-' + Date.now();
  const msgs = document.getElementById('chat-messages');
  if (msgs) {
    msgs.innerHTML += `<div id="${typingId}" class="chat-bubble ai" style="display:flex;gap:4px;align-items:center;">
      <div style="width:8px;height:8px;background:var(--text2);border-radius:50%;animation:pulse-ring 1s infinite;"></div>
      <div style="width:8px;height:8px;background:var(--text2);border-radius:50%;animation:pulse-ring 1s .2s infinite;"></div>
      <div style="width:8px;height:8px;background:var(--text2);border-radius:50%;animation:pulse-ring 1s .4s infinite;"></div>
    </div>`;
    scrollChatToBottom();
  }

  setTimeout(() => {
    const typing = document.getElementById(typingId);
    if (typing) typing.remove();
    const reply = getAIReply(text);
    State.chatMessages.push({ role: 'ai', text: reply });
    State.save();
    appendChatBubble({ role: 'ai', text: reply });
  }, 800 + Math.random() * 600);
}

function sendQuickMsg(text) {
  const input = document.getElementById('chat-input');
  if (input) { input.value = text; sendChat(); }
  else {
    navigate('chat', null);
    setTimeout(() => { const inp = document.getElementById('chat-input'); if(inp){inp.value=text;sendChat();} }, 300);
  }
}

function appendChatBubble(m) {
  const msgs = document.getElementById('chat-messages');
  if (!msgs) return;
  const div = document.createElement('div');
  div.className = `chat-bubble ${m.role}`;
  div.style.whiteSpace = 'pre-line';
  div.textContent = m.text;
  msgs.appendChild(div);
  scrollChatToBottom();
}

function getAIReply(text) {
  const t = text.toLowerCase();
  if (t.includes('시험') || t.includes('출제') || t.includes('중요')) return MOCK_CHAT['시험'];
  if (t.includes('요약') || t.includes('정리') || t.includes('핵심')) return MOCK_CHAT['요약'];
  if (t.includes('교수') || t.includes('강조') || t.includes('스타일')) return MOCK_CHAT['교수'];
  if (t.includes('오늘') || t.includes('플랜') || t.includes('공부')) return MOCK_CHAT['오늘'];
  if (t.includes('안녕') || t.includes('hello')) return '안녕하세요! 공부 자료에 대해 무엇이든 질문해보세요 😊\n업로드된 자료를 분석해서 최대한 도움드릴게요!';
  return `"${text}"에 대해 분석해봤어요.\n\n현재 업로드된 ${State.materials.filter(m=>m.status==='complete').length}개 자료를 기반으로:\n\n• 가장 관련성 높은 자료: ${State.materials.find(m=>m.status==='complete')?.name || '없음'}\n• 핵심 키워드: ${State.materials.find(m=>m.analysis)?.analysis?.keywords?.slice(0,3).join(', ') || '없음'}\n\n더 구체적으로 질문해주시면 더 정확하게 도움드릴 수 있어요!`;
}

function clearChat() {
  State.chatMessages = [...DEFAULT_CHAT];
  State.save();
  const msgs = document.getElementById('chat-messages');
  if (msgs) msgs.innerHTML = DEFAULT_CHAT.map(m => renderChatBubble(m)).join('');
}

// ────────────────────────────────────────────
// SEARCH
// ────────────────────────────────────────────
function handleSearch(query) {
  if (!query) return;
  const q = query.toLowerCase();
  const results = State.materials.filter(m =>
    m.status === 'complete' && (
      m.name.toLowerCase().includes(q) ||
      m.subject.toLowerCase().includes(q) ||
      m.analysis?.summary.toLowerCase().includes(q) ||
      m.analysis?.keywords.some(k => k.toLowerCase().includes(q))
    )
  );
  if (State.view !== 'materials') {
    State.subjectFilter = 'all';
    navigate('materials', null);
  }
}

// ────────────────────────────────────────────
// EXAM DATE
// ────────────────────────────────────────────
function setExamDate() {
  const date = prompt('시험 날짜를 입력하세요 (예: 2026-06-20)');
  if (date && /^\d{4}-\d{2}-\d{2}$/.test(date)) {
    State.examDate = date;
    State.save();
    renderView();
  } else if (date) {
    alert('날짜 형식이 올바르지 않아요. YYYY-MM-DD 형식으로 입력해주세요.');
  }
}
function changeExamDate() { setExamDate(); }

// ────────────────────────────────────────────
// DARK MODE
// ────────────────────────────────────────────
function toggleDark() {
  State.darkMode = !State.darkMode;
  document.documentElement.classList.toggle('dark', State.darkMode);
  const icon = document.getElementById('dark-icon');
  const label = document.getElementById('dark-label');
  if (icon) icon.textContent = State.darkMode ? '☀️' : '🌙';
  if (label) label.textContent = State.darkMode ? '라이트 모드' : '다크 모드';
  State.save();
}

// ────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────
function init() {
  State.load();

  // Dark mode
  document.documentElement.classList.toggle('dark', State.darkMode);
  const icon = document.getElementById('dark-icon');
  const label = document.getElementById('dark-label');
  if (icon) icon.textContent = State.darkMode ? '☀️' : '🌙';
  if (label) label.textContent = State.darkMode ? '라이트 모드' : '다크 모드';

  // Today date
  const today = document.getElementById('today-date');
  if (today) {
    const d = new Date();
    today.textContent = `${d.getMonth()+1}/${d.getDate()}`;
  }

  // Render
  updateSidebar();
  renderView();

  // Drag & drop on whole window
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    if (e.dataTransfer.files.length) handleDrop(e);
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
